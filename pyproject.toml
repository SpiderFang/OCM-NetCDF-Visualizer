[project]
name = "ocm-flow-visualization"
version = "0.1.0"
description = "Monthly OCM NetCDF preprocessing and visualization workflow for Taiwan-area current-field exploration."
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.0",
    "netCDF4>=1.7.2",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
]

[tool.uv]
package = false

